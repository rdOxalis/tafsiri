IssueTracker: https://github.com/rdOxalis/tafsiri/issues

AutoName: tafsiri

RepoType: git
Repo: https://github.com/rdOxalis/tafsiri

Builds:
  - versionName: 1.0.21
    versionCode: 1021
    commit: eb21b85741410fa9d654206c12008e79f236c52d
    submodules: true
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    prebuild:
      - sdkmanager 'cmake;3.22.1'
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get
    scanignore:
      - .flutter/bin/cache
      - .flutter/packages/flutter_tools/gradle
    scandelete:
      - .flutter/dev
      - .flutter/engine/src/flutter/shell/platform/android/build.gradle
      - .flutter/engine/src/flutter/testing/rules/.gradle
      - .pub-cache
      - android/third_party/Tesseract4Android/tesseract4android/src/main/cpp/leptonica/src/prog
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export TAFSIRI_UNSIGNED=1
      - .flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
        --dart-define=TAFSIRI_BUILD=$(git rev-parse --short HEAD)
    ndk: r27c

